name: Blog Draft Generator

on:
  # Editorial review is required before a draft enters content/blog.
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

# Drafts are committed to main; published posts are not changed by this workflow.

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # Research (web search) + writing, plus patience for the org's per-minute
    # token rate limit (the generator waits out 429s honouring retry-after).
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify secret is injected
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is empty. Check repo Settings → Secrets and variables → Actions → Repository secrets (NOT Environment secrets) and add ANTHROPIC_API_KEY there."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is set."

      - name: Run blog generator
        working-directory: app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: set a repo variable BLOG_MODEL to override the writing model
          # (Settings → Secrets and variables → Actions → Variables). Defaults to
          # claude-sonnet-4-6; set to claude-opus-4-8 for maximum quality.
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
        run: node scripts/blog-generator.mjs

      - name: Commit draft if created
        run: |
          git config user.name "TokenRate BlogBot"
          git config user.email "bot@tokenrate.dev"
          git add app/content/blog-drafts/ app/content/blog-angles-ledger.json
          if git diff --cached --quiet; then
            echo "No new posts to commit."
          else
            SLUG=$(git diff --cached --name-only -- 'app/content/blog-drafts/*.json' | head -1 | xargs -I{} basename {} .json 2>/dev/null || echo "draft")
            git commit -m "blog: draft — ${SLUG}"
            git pull --rebase origin main
            git push origin main
          fi
